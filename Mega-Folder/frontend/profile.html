<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopRight - My Profile</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo" aria-label="ShopRight home">
        ShopRight<span class="logo-accent" aria-hidden="true">!</span>
      </a>
      <ul class="nav-links"><li><a href="index.html">Home</a></li></ul>
      <div class="nav-actions">
        <a href="cart.html" class="cart-btn">🛒 <span class="cart-count" id="cartBadge" style="display:none;">0</span></a>
        <div class="user-menu">
          <button class="user-menu-btn" onclick="toggleUserMenu()"><span id="navUsername">User</span> ▼</button>
          <div class="user-dropdown" id="userDropdown">
            <a href="profile.html">👤 Profile</a>
            <a href="index.html" data-logout>🚪 Logout</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="profile-page container">
    <div class="profile-grid">
      <aside class="profile-sidebar">
        <div class="profile-avatar" id="profileAvatar">U</div>
        <h3 id="profileName">User</h3>
        <p class="email" id="profileEmail">user@example.com</p>
        <ul class="profile-nav">
          <li><a href="#" class="active" onclick="showTab('profile'); return false;">👤 Profile</a></li>
          <li><a href="#" onclick="showTab('orders'); return false;">📦 Orders</a></li>
          <li><a href="index.html" data-logout>🚪 Logout</a></li>
        </ul>
      </aside>
      <div class="profile-content" id="profileTab">
        <h2>Profile Information</h2>
        <form id="profileForm">
          <div class="form-row">
            <div class="form-group"><label>First Name</label><input type="text" id="firstName"></div>
            <div class="form-group"><label>Last Name</label><input type="text" id="lastName"></div>
          </div>
          <div class="form-group"><label>Email</label><input type="email" id="email" disabled></div>
          <div class="form-group"><label>Phone</label><input type="tel" id="phone"></div>
          <h3 style="margin: 1.5rem 0 1rem; font-size: 1.1rem;">Address</h3>
          <div class="form-group"><label>Street</label><input type="text" id="street"></div>
          <div class="form-row">
            <div class="form-group"><label>City</label><input type="text" id="city"></div>
            <div class="form-group"><label>State</label><input type="text" id="state"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>ZIP</label><input type="text" id="zipCode"></div>
            <div class="form-group"><label>Country</label><input type="text" id="country" value="USA"></div>
          </div>
          <button type="submit" class="btn-primary" style="width: auto; padding: 0.75rem 2rem;">Save Changes</button>
        </form>
      </div>
      <div class="profile-content" id="ordersTab" style="display:none;">
        <h2>Order History</h2>
        <div id="ordersList"><div class="spinner"></div></div>
      </div>
    </div>
  </main>

  <script>
    function showTab(tab) {
      document.getElementById('profileTab').style.display = tab === 'profile' ? 'block' : 'none';
      document.getElementById('ordersTab').style.display = tab === 'orders' ? 'block' : 'none';
      document.querySelectorAll('.profile-nav a').forEach(a => a.classList.remove('active'));
      event.target.classList.add('active');
      if (tab === 'orders') loadOrders();
    }
  </script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/scriptOnStart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
