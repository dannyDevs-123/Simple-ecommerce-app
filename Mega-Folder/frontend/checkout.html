<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopRight - Checkout</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo" aria-label="ShopRight home">
        ShopRight<span class="logo-accent" aria-hidden="true">!</span>
      </a>
      <div class="nav-actions">
        <div id="userSection" style="display:none;" class="user-menu">
          <button class="user-menu-btn" id="userMenuBtn" onclick="toggleUserMenu()"><span id="navUsername">User</span> ▼</button>
          <div class="user-dropdown" id="userDropdown">
            <a href="profile.html">👤 Profile</a>
            <a href="index.html" data-logout>🚪 Logout</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="checkout-page container">
    <h1>Checkout</h1>
    <div class="checkout-grid">
      <div>
        <div class="checkout-step">
          <div class="step-header"><div class="step-number">1</div><h3>Shipping Information</h3></div>
          <div class="form-row">
            <div class="form-group"><label>First Name</label><input type="text" id="shippingFirstName" required></div>
            <div class="form-group"><label>Last Name</label><input type="text" id="shippingLastName" required></div>
          </div>
          <div class="form-group"><label>Street Address</label><input type="text" id="shippingStreet" required></div>
          <div class="form-row">
            <div class="form-group"><label>City</label><input type="text" id="shippingCity" required></div>
            <div class="form-group"><label>State</label><input type="text" id="shippingState" required></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>ZIP Code</label><input type="text" id="shippingZip" required></div>
            <div class="form-group"><label>Phone</label><input type="tel" id="shippingPhone"></div>
          </div>
        </div>
        <div class="checkout-step">
          <div class="step-header"><div class="step-number">2</div><h3>Payment Method</h3></div>
          <div class="payment-methods">
            <label class="payment-method active">
              <input type="radio" name="payment" value="credit_card" checked style="display:none;">
              <div class="icon">💳</div><span>Credit Card</span>
            </label>
            <label class="payment-method">
              <input type="radio" name="payment" value="paypal" style="display:none;">
              <div class="icon">🅿️</div><span>PayPal</span>
            </label>
            <label class="payment-method">
              <input type="radio" name="payment" value="cod" style="display:none;">
              <div class="icon">💵</div><span>Cash on Delivery</span>
            </label>
          </div>
          <p style="font-size: 0.85rem; color: var(--gray-500); margin-top: 0.5rem;">* This is a demo. No real payment will be processed.</p>
        </div>
        <button class="checkout-btn" id="placeOrderBtn" onclick="placeOrder()">Place Order</button>
      </div>
      <div class="cart-summary" id="checkoutSummary"><div class="spinner"></div></div>
    </div>
  </main>

  <script>
    document.querySelectorAll('.payment-method').forEach(el => {
      el.addEventListener('click', function() {
        document.querySelectorAll('.payment-method').forEach(e => e.classList.remove('active'));
        this.classList.add('active');
        this.querySelector('input').checked = true;
      });
    });
  </script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/scriptOnStart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
