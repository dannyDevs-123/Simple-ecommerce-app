<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopRight - Shopping Cart</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo" aria-label="ShopRight home">
        ShopRight<span class="logo-accent" aria-hidden="true">!</span>
      </a>
      <ul class="nav-links"><li><a href="index.html">← Continue Shopping</a></li></ul>
      <div class="nav-actions">
        <div id="authSection"><a href="login.html" class="auth-btn">Sign In</a></div>
        <div id="userSection" style="display:none;" class="user-menu">
          <button class="user-menu-btn" id="userMenuBtn" onclick="toggleUserMenu()"><span id="navUsername">User</span> ▼</button>
          <div class="user-dropdown" id="userDropdown">
            <a href="profile.html">👤 Profile</a>
            <a href="index.html" data-logout>🚪 Logout</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="cart-page container">
    <h1>Shopping Cart</h1>
    <div class="cart-grid">
      <div class="cart-items" id="cartItems"><div class="spinner"></div></div>
      <div class="cart-summary" id="cartSummary" style="display:none;"></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/scriptOnStart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
