<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopRight - Create Account</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="logo" aria-label="ShopRight home">
        ShopRight<span class="logo-accent" aria-hidden="true">!</span>
      </a>
      <h2>Create Account</h2>
      <p class="subtitle">Join us for the best shopping experience</p>
      <form id="registerForm">
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" placeholder="John">
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Doe">
          </div>
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" required placeholder="johndoe">
          <div class="error-message"></div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
          <div class="error-message"></div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="Min 6 characters">
          <div class="error-message"></div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" required placeholder="Repeat password">
          <div class="error-message"></div>
        </div>
        <button type="submit" class="btn-primary">Create Account</button>
      </form>
      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
