<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopRight - Product Details</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo" aria-label="ShopRight home">
        ShopRight<span class="logo-accent" aria-hidden="true">!</span>
      </a>
      <ul class="nav-links"><li><a href="index.html">← Back to Shop</a></li></ul>
      <div class="nav-actions">
        <a href="cart.html" class="cart-btn">🛒 <span class="cart-count" id="cartBadge" style="display:none;">0</span></a>
        <div id="authSection"><a href="login.html" class="auth-btn">Sign In</a></div>
        <div id="userSection" style="display:none;" class="user-menu">
          <button class="user-menu-btn" id="userMenuBtn" onclick="toggleUserMenu()"><span id="navUsername">User</span> ▼</button>
          <div class="user-dropdown" id="userDropdown">
            <a href="profile.html">👤 Profile</a>
            <a href="index.html" data-logout>🚪 Logout</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container" style="padding: 2rem 1rem;">
    <div id="productDetail"><div class="spinner"></div></div>
    <div id="relatedProducts" style="margin-top: 3rem;"></div>
  </main>

  <footer class="footer"><div class="container"><div class="footer-bottom">© 2024 ShopRight. All rights reserved.</div></div></footer>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/scriptOnStart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
